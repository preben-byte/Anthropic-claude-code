<script>
(function(){
  var vp = document.getElementById('viewport'), world = document.getElementById('world'), img = document.getElementById('map');
  var scale = 1, tx = 0, ty = 0, IW = 1200, IH = 2610;
  function apply(){
    world.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')';
    world.style.setProperty('--inv', 1/scale);
  }
  function fit(){
    var vw = vp.clientWidth, vh = vp.clientHeight;
    world.style.width = IW+'px';
    scale = Math.max(vw/IW, Math.min(vw/IW, vh/IH));
    scale = vw/IW; // fyll bredden
    tx = 0; ty = 0; apply();
  }
  window.addEventListener('resize', fit); fit();
  function clamp(){
    var vw = vp.clientWidth, vh = vp.clientHeight, w = IW*scale, h = IH*scale;
    tx = Math.min(Math.max(tx, vw - w - 80), 80);
    ty = Math.min(Math.max(ty, vh - h - 80), 80);
  }
  function zoomAt(cx, cy, f){
    var ns = Math.min(Math.max(scale*f, 0.15), 12);
    tx = cx - (cx - tx) * (ns/scale); ty = cy - (cy - ty) * (ns/scale);
    scale = ns; clamp(); apply();
  }
  vp.addEventListener('wheel', function(e){ e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.18 : 1/1.18); }, {passive:false});
  var drag = null, pts = new Map();
  vp.addEventListener('pointerdown', function(e){ pts.set(e.pointerId, [e.clientX, e.clientY]); if(pts.size===1){ drag=[e.clientX,e.clientY]; vp.classList.add('dragging'); } vp.setPointerCapture(e.pointerId); });
  vp.addEventListener('pointermove', function(e){
    if(!pts.has(e.pointerId)) return;
    var prev = Array.from(pts.values());
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if(pts.size===2){
      var cur = Array.from(pts.values());
      var d0 = Math.hypot(prev[0][0]-prev[1][0], prev[0][1]-prev[1][1]);
      var d1 = Math.hypot(cur[0][0]-cur[1][0], cur[0][1]-cur[1][1]);
      var cx = (cur[0][0]+cur[1][0])/2, cy = (cur[0][1]+cur[1][1])/2;
      if(d0>0) zoomAt(cx, cy, d1/d0);
      drag = null;
    } else if(drag){
      tx += e.clientX - drag[0]; ty += e.clientY - drag[1];
      drag = [e.clientX, e.clientY]; clamp(); apply();
    }
  });
  function up(e){ pts.delete(e.pointerId); if(pts.size===0){ drag=null; vp.classList.remove('dragging'); } else { drag = Array.from(pts.values())[0].slice(); } }
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
  var last = 0;
  vp.addEventListener('pointerup', function(e){ var now = e.timeStamp; if(now - last < 320 && pts.size===0){ zoomAt(e.clientX, e.clientY, 1.9); } last = now; });
  window.showInfo = function(el, title, body){
    document.querySelectorAll('.mk.selected').forEach(function(m){ m.classList.remove('selected'); });
    el.classList.add('selected');
    document.getElementById('infobody').innerHTML = '<b>'+title+'</b><br>'+body;
    document.getElementById('info').style.display = 'block';
  };
})();
</script>
